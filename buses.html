<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buses</title>
  <style>
    :root {
      --bg:           #dde3ec;
      --card-bg:      #ffffff;
      --border:       #e2e8f0;
      --text-primary: #0f172a;
      --text-head:    #1e293b;
      --text-sec:     #64748b;
      --text-dim:     #94a3b8;
      --text-faint:   #cbd5e1;
      --now:          #16a34a;
      --skeleton:     #e2e8f0;
      --pill-unknown: #94a3b8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0f172a;
        --card-bg:      #1e293b;
        --border:       #334155;
        --text-primary: #f1f5f9;
        --text-head:    #e2e8f0;
        --text-sec:     #94a3b8;
        --text-dim:     #64748b;
        --text-faint:   #475569;
        --now:          #4ade80;
        --skeleton:     #334155;
        --pill-unknown: #475569;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      flex: 1;
      min-height: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */

    .card-header {
      flex-shrink: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      min-width: 0;
    }

    .bus-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.88rem;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .bus-pill.red     { background: #DA291C; }
    .bus-pill.blue    { background: #005AA0; }
    .bus-pill.unknown { background: var(--pill-unknown); }

    .destination {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-head);
    }

    .dest-label {
      font-weight: 400;
      color: var(--text-dim);
    }

    .from-stop {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.01em;
    }

    /* ── Departures ── */

    .departures {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 4px;
      min-height: 0;
    }

    .dep-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* First (next) departure — dominant */
    .dep-row:first-child .dep-num {
      font-size: clamp(3.2rem, 12svh, 5.5rem);
      font-weight: 800;
      line-height: 1;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .dep-row:first-child .dep-unit {
      font-size: clamp(0.95rem, 3svh, 1.5rem);
      font-weight: 500;
      color: var(--text-sec);
      align-self: flex-end;
      padding-bottom: 0.35em;
    }

    /* 2nd and 3rd departures — secondary */
    .dep-row:not(:first-child) .dep-num {
      font-size: clamp(1.6rem, 6svh, 3rem);
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: -0.02em;
    }

    .dep-row:not(:first-child) .dep-unit {
      font-size: clamp(0.75rem, 2svh, 1.1rem);
      color: var(--text-faint);
    }

    /* "Nu" state */
    .dep-num.now {
      color: var(--now) !important;
    }

    /* Loading skeleton */
    .skeleton {
      background: var(--skeleton);
      border-radius: 6px;
      color: transparent !important;
      user-select: none;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 0.2; }
    }

    .no-deps {
      color: var(--text-faint);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>

  <script>
    const ROUTES = [
      { siteId: 9183, line: '143', directionCode: 2, from: 'Gubbängen',  to: 'Älvsjö',      label: 'school' },
      { siteId: 9162, line: '143', directionCode: 1, from: 'Högdalen',   to: 'Sköndalsbro', label: 'home'   },
      { siteId: 9182, line: '172', directionCode: 2, from: 'Hökarängen', to: 'Hallunda',     label: 'school' },
      { siteId: 9162, line: '172', directionCode: 1, from: 'Högdalen',   to: 'Skarpnäck',   label: 'home'   },
    ];

    const API = 'https://transport.integration.sl.se/v1';

    // ── Helpers ─────────────────────────────────────────────────────────────

    function minsUntil(isoTime) {
      return Math.round((new Date(isoTime) - Date.now()) / 60000);
    }

    function formatTime(isoTime) {
      const d = new Date(isoTime);
      return d.getHours().toString().padStart(2, '0') + ':' +
             d.getMinutes().toString().padStart(2, '0');
    }

    // Returns { num, unit, isNow } for a departure
    function departure(mins, isoTime) {
      if (mins <= 0)  return { num: 'Now',        unit: '',    isNow: true };
      if (mins < 60)  return { num: String(mins), unit: 'min', isNow: false };
      return { num: formatTime(isoTime), unit: '',  isNow: false };
    }

    // ── DOM builders ─────────────────────────────────────────────────────────

    function depRowHTML(num, unit, isNow) {
      const nowClass = isNow ? ' now' : '';
      return `<div class="dep-row">` +
               `<span class="dep-num${nowClass}">${num}</span>` +
               (unit ? `<span class="dep-unit">${unit}</span>` : '') +
             `</div>`;
    }

    function skeletonCard(route, idx) {
      return `
        <div class="card" id="card-${idx}">
          <div class="card-header">
            <div class="card-title">
              <span class="bus-pill unknown skeleton" id="pill-${idx}">${route.line}</span>
              <span class="destination">→ ${route.to} <span class="dest-label">(${route.label})</span></span>
            </div>
            <div class="from-stop">from ${route.from}</div>
          </div>
          <div class="departures" id="deps-${idx}">
            <div class="dep-row"><span class="dep-num skeleton">00</span><span class="dep-unit skeleton"> min</span></div>
            <div class="dep-row"><span class="dep-num skeleton">00</span><span class="dep-unit skeleton"> min</span></div>
            <div class="dep-row"><span class="dep-num skeleton">00</span><span class="dep-unit skeleton"> min</span></div>
          </div>
        </div>`;
    }

    function updateCard(idx, deps) {
      const pill = document.getElementById(`pill-${idx}`);
      const depsEl = document.getElementById(`deps-${idx}`);

      // Determine color from first departure with a known group_of_lines
      let isBlue = ROUTES[idx].line === '172'; // fallback
      for (const d of deps) {
        if (d.line && d.line.group_of_lines !== undefined) {
          isBlue = d.line.group_of_lines === 'Blåbuss';
          break;
        }
      }

      pill.className = `bus-pill ${isBlue ? 'blue' : 'red'}`;

      if (deps.length === 0) {
        depsEl.innerHTML = `<span class="no-deps">Inga avgångar</span>`;
        return;
      }

      depsEl.innerHTML = deps.map(d => {
        const mins = minsUntil(d.expected);
        const { num, unit, isNow } = departure(mins, d.expected);
        return depRowHTML(num, unit, isNow);
      }).join('');
    }

    function errorCard(idx) {
      const depsEl = document.getElementById(`deps-${idx}`);
      const pill = document.getElementById(`pill-${idx}`);
      pill.className = `bus-pill ${ROUTES[idx].line === '172' ? 'blue' : 'red'}`;
      depsEl.innerHTML = `<span class="no-deps">–</span>`;
    }

    // ── Fetch ────────────────────────────────────────────────────────────────

    async function fetchSite(siteId) {
      const res = await fetch(
        `${API}/sites/${siteId}/departures?transport=BUS&forecast=120`,
        { signal: AbortSignal.timeout(8000) }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.departures || [];
    }

    async function refresh() {
      const uniqueIds = [...new Set(ROUTES.map(r => r.siteId))];

      const cache = {};
      await Promise.all(uniqueIds.map(async id => {
        try   { cache[id] = await fetchSite(id); }
        catch { cache[id] = null; }
      }));

      ROUTES.forEach((route, i) => {
        const all = cache[route.siteId];
        if (all === null) { errorCard(i); return; }

        const filtered = all
          .filter(d => d.line.designation === route.line &&
                       d.direction_code   === route.directionCode)
          .slice(0, 3);

        updateCard(i, filtered);
      });
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    const grid = document.getElementById('grid');
    ROUTES.forEach((r, i) => { grid.innerHTML += skeletonCard(r, i); });

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
